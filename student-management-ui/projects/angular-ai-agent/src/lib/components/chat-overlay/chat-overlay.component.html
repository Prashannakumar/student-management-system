<div class="chat-container">
  <!-- Chat Trigger Button (FAB) -->
  <button class="chat-fab" (click)="toggleChat()" *ngIf="!isOpen" title="Open AI Chat">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen" [class.fade-in]="isOpen">
    <div class="chat-header">
      <div class="header-info">
        <div class="status-dot"></div>
        <div class="header-text">
          <span class="title">AI Assistant</span>
          <span class="subtitle">Online</span>
        </div>
      </div>
      <button class="close-btn" (click)="toggleChat()" title="Close chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="chat-messages" #scrollContainer>
      <div *ngFor="let msg of messages$ | async" class="message-wrapper" [class.user]="msg.role === 'user'"
        [class.ai]="msg.role === 'ai'">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
        <div class="message-time">{{ msg.timestamp | date:'shortTime' }}</div>
      </div>

      <!-- Loading Indicator -->
      <div class="message-wrapper ai loading" *ngIf="isLoading$ | async">
        <div class="message-bubble">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input [(ngModel)]="input" (keyup.enter)="send()" placeholder="Ask me anything..." autocomplete="off" />
      <button class="send-btn" (click)="send()" [disabled]="!input.trim()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>
