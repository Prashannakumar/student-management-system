<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary mb-0"><i class="fas fa-users me-2"></i>Students</h2>
    <a routerLink="/students/add" class="btn btn-success">
        <i class="fas fa-user-plus me-1"></i> Add Student
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="bg-light text-secondary text-uppercase small">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Balance Fee</th>
                        <th class="text-center pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let student of students" class="align-middle">
                        <td class="ps-4 fw-bold">#{{ student.studentId }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.email }}</td>
                        <td>
                            <span class="badge bg-info text-dark" *ngIf="student.course">
                                {{ student.course.courseName }}
                            </span>
                            <span class="text-muted small" *ngIf="!student.course">No Course</span>
                        </td>
                        <td>
                            <span [class.text-danger]="student.balanceFee > 0">
                                {{ student.balanceFee | currency:'USD' }}
                            </span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="btn-group btn-group-sm">
                                <a [routerLink]="['/students/edit', student.studentId]" class="btn btn-outline-primary"
                                    title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button (click)="deleteStudent(student.studentId)" class="btn btn-outline-danger"
                                    title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="students.length === 0">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fas fa-user-slash fa-3x mb-3 d-block opacity-25"></i>
                            No students found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
