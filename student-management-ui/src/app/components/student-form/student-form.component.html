<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h3 class="card-title mb-0">
                    <i class="fas" [ngClass]="isEditMode ? 'fa-user-edit' : 'fa-user-plus'"></i>
                    {{ isEditMode ? 'Edit Student' : 'Add New Student' }}
                </h3>
            </div>
            <div class="card-body p-4">
                <form [formGroup]="studentForm" (ngSubmit)="saveStudent()">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" formControlName="name"
                                required placeholder="Enter student name">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" formControlName="email"
                                required placeholder="Enter email">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-bold">Phone Number</label>
                            <input type="text" class="form-control" id="phone" name="phone" formControlName="phone"
                                required placeholder="Enter phone number">
                        </div>
                        <div class="col-md-6">
                            <label for="course" class="form-label fw-bold">Select Course</label>
                            <select class="form-select" id="course" name="course" formControlName="course"
                                (change)="onCourseChange()" [compareWith]="compareCourses" required>
                                <option [ngValue]="null" disabled>Choose a course...</option>
                                <option *ngFor="let course of courses" [ngValue]="course">
                                    {{ course.courseName }} ({{ course.courseFee | currency:'USD' }})
                                </option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-muted">Total Fee</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control bg-light" name="totalFee"
                                    formControlName="totalFee" readonly>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="paidFee" class="form-label fw-bold">Paid Fee</label>
                            <div class="input-group">
                                <span class="input-group-text bg-success text-white">$</span>
                                <input type="number" class="form-control" id="paidFee" name="paidFee"
                                    formControlName="paidFee" (input)="calculateBalance()" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Balance</label>
                            <div class="input-group">
                                <span class="input-group-text bg-warning">$</span>
                                <input type="number" class="form-control fw-bold" name="balanceFee"
                                    formControlName="balanceFee" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a routerLink="/students" class="btn btn-light me-2 px-4 text-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5" [disabled]="studentForm.invalid">
                            {{ isEditMode ? 'Update Student' : 'Register Student' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
