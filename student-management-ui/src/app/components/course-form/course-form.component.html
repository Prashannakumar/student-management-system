<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h3 class="card-title mb-0">
                    <i class="fas" [ngClass]="isEditMode ? 'fa-edit' : 'fa-plus-circle'"></i>
                    {{ isEditMode ? 'Edit Course' : 'Create New Course' }}
                </h3>
            </div>
            <div class="card-body p-4">
                <form [formGroup]="courseForm" (ngSubmit)="saveCourse()">
                    <input type="hidden" formControlName="courseId">

                    <div class="mb-3">
                        <label for="courseName" class="form-label fw-bold">Course Name</label>
                        <input type="text" class="form-control" id="courseName" formControlName="courseName"
                            placeholder="e.g. Java Full Stack">
                    </div>

                    <div class="mb-3">
                        <label for="duration" class="form-label fw-bold">Duration</label>
                        <input type="text" class="form-control" id="duration" formControlName="duration"
                            placeholder="e.g. 3 Months">
                    </div>

                    <div class="mb-3">
                        <label for="courseFee" class="form-label fw-bold">Course Fee</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="courseFee" formControlName="courseFee">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <a routerLink="/courses" class="btn btn-light me-2 px-4 text-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success px-5" [disabled]="courseForm.invalid">
                            {{ isEditMode ? 'Save Course' : 'Create Course' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
