<!-- Floating Action Button -->
<button class="fab-btn" (click)="togglePanel()" [class.active]="isOpen">
  <i class="fas" [ngClass]="isOpen ? 'fa-times' : 'fa-wand-magic-sparkles'"></i>
</button>

<!-- Command Panel -->
<div class="ai-container" *ngIf="isOpen" @slideInOut>
  <div class="ai-header">
    <div class="ai-title">
      <i class="fas fa-robot me-2"></i>
      <span>AI Assistant</span>
    </div>
    <button class="close-btn" (click)="togglePanel()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="ai-messages" #scrollContainer>
    <div *ngFor="let msg of messages" class="message-wrapper" [class.user]="msg.role === 'user'">
      <div class="message-bubble" [class.user]="msg.role === 'user'">
        {{msg.content}}
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isLoading" class="message-wrapper">
      <div class="message-bubble loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="ai-input-area">
    <div class="input-container">
      <input [(ngModel)]="inputText" (keyup.enter)="send()" placeholder="Type a command (Ctrl + I)..."
        [disabled]="isLoading" #commandInput />
      <button class="send-btn" (click)="send()" [disabled]="!inputText.trim() || isLoading">
        <i class="fas fa-paper-plane" *ngIf="!isLoading"></i>
        <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
      </button>
    </div>
  </div>
</div>
