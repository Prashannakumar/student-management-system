spring:
  application:
    name: student-management-system
  
  datasource:
    url: jdbc:mysql://localhost:3306/student_management_system
    username: root
    password: root@123
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0
